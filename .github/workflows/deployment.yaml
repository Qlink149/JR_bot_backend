name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/jr_bot_backend' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'jr_backend:latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment values
        run: |
          missing=()
          for name in \
            VPS_HOST \
            VPS_USERNAME \
            VPS_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions values. Add them as repository secrets or variables:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            set -e
            APP_DIR="${{ env.APP_DIR }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"

            CLONE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Qlink149/JR_bot_backend.git"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$CLONE_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$APP_DIR"
              git clone "$CLONE_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            docker build -t "$IMAGE_NAME" .
            docker stop qlink || true
            docker rm qlink || true
            docker run -d \
              --name qlink \
              -p 8000:8000 \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e GUPSHUP_APP_ID=${{ secrets.GUPSHUP_APP_ID }} \
              -e GUPSHUP_TOKEN=${{ secrets.GUPSHUP_TOKEN }} \
              -e GUPSHUP_APP_NAME=${{ secrets.GUPSHUP_APP_NAME }} \
              -e GUPSHUP_API_KEY=${{ secrets.GUPSHUP_API_KEY }} \
              -e GUPSHUP_SOURCE=${{ secrets.GUPSHUP_SOURCE }} \
              -e DEFAULT_COUNTRY_CODE=${{ secrets.DEFAULT_COUNTRY_CODE }} \
              -e ENV_MODE=${{ secrets.ENV_MODE }} \
              -e PINECONE_API=${{ secrets.PINECONE_API }} \
              -e R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }} \
              -e R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }} \
              -e WHAPI_TOKEN=${{ secrets.WHAPI_TOKEN }} \
              -e WEBHOOK_API=${{ secrets.WEBHOOK_API }} \
              -e QLINK_GUPSHUP_APP_ID=${{ secrets.QLINK_GUPSHUP_APP_ID }} \
              -e QLINK_GUPSHUP_PARTNER_APP_TOKEN=${{ secrets.QLINK_GUPSHUP_PARTNER_APP_TOKEN }} \
              -e QLINK_GUPSHUP_SOURCE=${{ secrets.QLINK_GUPSHUP_SOURCE }} \
              -e QLINK_GUPSHUP_APP_NAME=${{ secrets.QLINK_GUPSHUP_APP_NAME }} \
              -e JR_API_USERNAME=${{ secrets.JR_API_USERNAME }} \
              -e JR_API_PASSWORD=${{ secrets.JR_API_PASSWORD }} \
              -e JR_API_CLIENT_ID=${{ secrets.JR_API_CLIENT_ID }} \
              -e JR_API_CLIENT_SECRET=${{ secrets.JR_API_CLIENT_SECRET }} \
              -e CORS_ORIGINS=${{ secrets.CORS_ORIGINS }} \
              "$IMAGE_NAME"

      - name: Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: docker image prune -f
