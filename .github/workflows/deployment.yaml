name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
      VPS_USERNAME: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || vars.VPS_PASSWORD }}
      APP_DIR: ${{ vars.APP_DIR || '/opt/jr_bot_backend' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'jr_backend:latest' }}
      ENV_FILE: ${{ vars.ENV_FILE || '/opt/jr_backend.env' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment values
        run: |
          missing=()
          for name in \
            VPS_HOST \
            VPS_USERNAME \
            VPS_PASSWORD
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required GitHub Actions values. Add them as repository secrets or variables:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: |
            set -e
            APP_DIR="${{ env.APP_DIR }}"
            IMAGE_NAME="${{ env.IMAGE_NAME }}"
            ENV_FILE="${{ env.ENV_FILE }}"

            CLONE_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Qlink149/JR_bot_backend.git"

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git remote set-url origin "$CLONE_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf "$APP_DIR"
              git clone "$CLONE_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            DOCKER_BUILDKIT=1 docker build -t "$IMAGE_NAME" .
            docker stop qlink || true
            docker rm qlink || true
            docker ps -q --filter "publish=8000" | xargs -r docker stop || true
            docker ps -aq --filter "publish=8000" | xargs -r docker rm || true
            docker run -d \
              --name qlink \
              -p 8000:8000 \
              --env-file "$ENV_FILE" \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONDONTWRITEBYTECODE=1 \
              "$IMAGE_NAME"

      - name: Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USERNAME }}
          password: ${{ env.VPS_PASSWORD }}
          script: docker image prune -f
